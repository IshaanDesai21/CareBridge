<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBridge - Patient Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .auth-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .dashboard {
            display: none;
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .wellness-score {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }
        
        .slider-container {
            margin-bottom: 20px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
        }
        
        .patients-list {
            display: grid;
            gap: 15px;
        }
        
        .patient-item {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 CareBridge</h1>
            <p>Healthcare Coordination Platform</p>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <div class="tabs">
                <div class="tab active" onclick="showLogin()">Login</div>
                <div class="tab" onclick="showRegister()">Register</div>
            </div>

            <div id="loginForm">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button onclick="login()">Sign In</button>
            </div>

            <div id="registerForm" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="regFirstName" placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="regLastName" placeholder="Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <button onclick="register()">Create Account</button>
            </div>

            <div id="message"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Welcome, <span id="userName"></span>!</h2>
                    <button class="secondary" onclick="logout()">Logout</button>
                </div>
                <div class="wellness-score" id="wellnessScore">75</div>
                <p style="text-align: center; color: #666;">Your Wellness Score</p>
            </div>

            <div class="card">
                <h2>Daily Wellness Check-In</h2>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Energy Level</span>
                        <span id="energyValue">5</span>
                    </div>
                    <input type="range" min="1" max="10" value="5" id="energy" oninput="updateValue('energy')">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Mood</span>
                        <span id="moodValue">5</span>
                    </div>
                    <input type="range" min="1" max="10" value="5" id="mood" oninput="updateValue('mood')">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Pain Level</span>
                        <span id="painValue">5</span>
                    </div>
                    <input type="range" min="1" max="10" value="5" id="pain" oninput="updateValue('pain')">
                </div>

                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea id="notes" rows="3" placeholder="How are you feeling today?"></textarea>
                </div>

                <button onclick="submitCheckin()">Submit Check-In</button>
            </div>

            <div class="card">
                <h2>All Patients</h2>
                <div id="patientsList" class="patients-list">
                    <p>Loading patients...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentUser = null;
        let patientId = null;

        function showMessage(msg, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="alert ${type}">${msg}</div>`;
            setTimeout(() => messageDiv.innerHTML = '', 3000);
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.querySelectorAll('.tab')[1].classList.remove('active');
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.querySelectorAll('.tab')[0].classList.remove('active');
        }

        async function register() {
            const data = {
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    token = result.token;
                    localStorage.setItem('token', token);
                    currentUser = result.user;
                    showDashboard();
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Registration failed: ' + error.message, 'error');
            }
        }

        async function login() {
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    token = result.token;
                    localStorage.setItem('token', token);
                    currentUser = result.user;
                    showDashboard();
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Login failed: ' + error.message, 'error');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            currentUser = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userName').textContent = currentUser.firstName || currentUser.email;
            loadPatients();
        }

        async function loadPatients() {
            try {
                const response = await fetch('/api/patients');
                const result = await response.json();
                
                if (result.patients && result.patients.length > 0) {
                    patientId = result.patients[0].id; // Use first patient for demo
                    
                    const html = result.patients.map(p => `
                        <div class="patient-item">
                            <div>
                                <strong>${p.first_name} ${p.last_name}</strong><br>
                                <small>${p.email}</small>
                            </div>
                            <div style="text-align: right;">
                                <strong style="font-size: 1.5em; color: #667eea;">${p.wellness_score}</strong><br>
                                <small>Wellness Score</small>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('patientsList').innerHTML = html;
                } else {
                    document.getElementById('patientsList').innerHTML = '<p>No patients yet. You are the first!</p>';
                    patientId = 1; // Assume current user is patient 1
                }
            } catch (error) {
                document.getElementById('patientsList').innerHTML = '<p>Error loading patients</p>';
            }
        }

        function updateValue(id) {
            const value = document.getElementById(id).value;
            document.getElementById(id + 'Value').textContent = value;
        }

        async function submitCheckin() {
            if (!patientId) {
                showMessage('Please wait while we load your profile...', 'error');
                return;
            }

            const data = {
                patientId: patientId,
                energy: parseInt(document.getElementById('energy').value),
                mood: parseInt(document.getElementById('mood').value),
                pain: parseInt(document.getElementById('pain').value),
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/wellness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showMessage('Check-in submitted successfully! 🎉');
                    document.getElementById('wellnessScore').textContent = result.wellnessScore;
                    document.getElementById('notes').value = '';
                    loadPatients(); // Refresh patient list
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Submission failed: ' + error.message, 'error');
            }
        }

        // Check if already logged in
        if (token) {
            // In a real app, verify token here
            showDashboard();
        }
    </script>
</body>
</html>
