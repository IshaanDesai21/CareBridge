name: Deploy

# Render already auto-deploys both services on every push to main (see
# render.yaml's autoDeploy: true). This workflow triggers the same deploys
# explicitly via Render's Deploy Hooks so the deploy shows up in the GitHub
# Actions tab, and gives us a place to add build/test gates before it fires.
on:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & build dashboard
        run: |
          cd dashboard
          npm ci
          npm run build
      - name: Install backend deps
        run: |
          cd backend
          npm ci

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — API
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
      - name: Trigger Render deploy — Dashboard
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_DASHBOARD }}"
